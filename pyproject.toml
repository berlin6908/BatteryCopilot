[project]
name = "battery-engineering-copilot"
version = "0.1.0"
description = "Evidence-grounded battery engineering knowledge graph and agent workbench"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "neo4j>=5.26,<6",
  "neo4j-graphrag>=1.9,<2",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "docling>=2.60,<3",
  "sentence-transformers>=5,<6",
  "httpx>=0.28,<1",
  "rdflib>=7,<8",
  "pypdfium2>=4.30,<6",
]

[dependency-groups]
dev = [
    "editables>=0.6",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/battery_copilot"]

[tool.hatch.build]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["integration: requires local Neo4j with KIT data imported"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
